const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=0)=>Number(n).toLocaleString(undefined,{maximumFractionDigits:d});
let state,tab='today',day=C.dayOf(),health={},nativeStatus={native:!!A,reminder:false,exact:false,notifications:false},toastTimer,confirmAction,loaded=false;
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,4500);}

function save(next){try{const valid=C.validate(next);const text=JSON.stringify(valid);if(A){const error=A.save(text);if(error)throw Error(error);}else localStorage.setItem(KEY,text);state=valid;return true;}catch(e){toast(e.message||'Could not save.');return false;}}
function localTime(iso){const d=new Date(iso);return C.dayOf(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}

function dateBar(){return `<div class="date-bar"><button data-action="previous" aria-label="Previous day">‹</button><input id="day-picker" aria-label="Journal date" type="date" value="${day}" max="${C.dayOf()}"><button data-action="next" aria-label="Next day" ${day>=C.dayOf()?'disabled':''}>›</button><button data-action="today-date">Today</button></div>`;}

function today(){const t=C.totals(state,day),s=state.stools.filter(x=>x.day===day).sort((a,b)=>a.at.localeCompare(b.at)),goal=state.goals.calories,pct=goal?Math.min(100,t.calories/goal*100):0;
return heading(day===C.dayOf()?'The meat suit has notes.':'Previously, inside you.',pretty(day))+dateBar()+`<div class="two-actions"><button data-action="meal">Log a meal <span>+</span></button><button data-action="stool">Log a bowel movement <span>∿</span></button></div>${window.RhythmBodyUI?.actions()||''}`+`
<div class="grid"><section class="card nutrition"><div class="eyebrow">NOURISHMENT · YOUR MEAL LOG</div><div class="calorie-line"><div><div class="calorie-value">${fmt(t.calories)} <span class="unit">kcal</span></div><small>${goal?`of your ${fmt(goal)} kcal goal`:'No calorie goal set'} · ${t.count} ${t.count===1?'meal':'meals'}</small></div><svg class="ring" viewBox="0 0 110 110" aria-label="${goal?Math.round(pct)+' percent of calorie goal':'No calorie goal set'}" role="img"><circle cx="55" cy="55" r="45" fill="none" stroke="#ffffff20" stroke-width="8"/><circle cx="55" cy="55" r="45" fill="none" stroke="#eadcc0" stroke-width="8" stroke-linecap="round" stroke-dasharray="${pct*2.827} 283" transform="rotate(-90 55 55)"/><text x="55" y="59" text-anchor="middle">${goal?Math.round(t.calories/goal*100)+'%':'YOUR DAY'}</text></svg></div><div class="macros">${[['protein','Protein',''],['carbs','Carbs','carb'],['fat','Fat','fat']].map(([n,label,cls])=>`<div><span class="macro-label"><i class="dot ${cls}"></i>${label}</span><strong>${t.count&&t.missing[n]===t.count?'—':fmt(t[n],1)}<small> g${t.missing[n]?'*':''}</small></strong>${state.goals[n]?`<small>Goal: ${fmt(state.goals[n])} g</small>`:''}</div>`).join('')}</div><small>Fiber ${t.count&&t.missing.fiber===t.count?'—':fmt(t.fiber,1)} g${t.missing.fiber?'*':''}${state.goals.fiber?' / '+fmt(state.goals.fiber)+' g goal':''} · Sugar ${fmt(t.sugar,1)} g${t.missing.sugar?'*':''} · Sodium ${fmt(t.sodium)} mg${t.missing.sodium?'*':''}</small>${Object.values(t.missing).some(Boolean)?'<p class="small" style="margin:12px 0 0;color:#d5dfd2">*Some meal values are unknown; totals include entered values only.</p>':''}</section>
<section class="card bowel-card"><div><div class="eyebrow">DIGESTION</div><h2>Bowel check-in</h2><div class="bowel-number">${s.length?s.length:state.noBowel.includes(day)?'0':'—'}</div><small>${s.length?'movements logged':state.noBowel.includes(day)?'none reported':'not recorded yet'}</small></div><div class="bowel-side">${s.length?`<span class="pill">Last: Bristol ${s[s.length-1].type}</span><p>${esc(C.bristol[s[s.length-1].type-1])}</p><small>${time(s[s.length-1].at)}</small>`:`<p class="small muted">A quick log helps you see your patterns.</p><button class="ghost small" data-action="no-bowel">${state.noBowel.includes(day)?'Undo “none today”':'No movement today'}</button>`}</div></section></div>
<section class="card"><h2>Homemade, made easier.</h2><p class="setting-copy">Describe ingredients and portions. Use ChatGPT to estimate calories, macros and fiber, then review before logging.</p><button data-action="ai-meal">Estimate a homemade meal</button><button class="ghost" data-action="daily-context">Daily check-in</button></section><div class="section-head"><h2>The bigger picture</h2><button class="ghost small" data-action="sync">Refresh ↻</button></div><div id="health-grid" class="health-grid"></div><p id="health-note" class="health-note"></p>
<div class="section-head"><h2>Your day, as it happened</h2><span class="pill">${t.count+s.length} entries</span></div><section class="card timeline">${entries(day)}</section>${window.RhythmBodyUI?.entries(day)||''}
${window.RhythmGarmin?.card(day)||''}<div class="callout"><span class="clock">8:00 <small>PM</small></span><div><strong>Your evening pause.</strong><p>Meals, nutrition, and a quick bowel check-in.${A?nativeStatus.reminder?' Phone reminder enabled.':' Enable your phone reminder in Settings.':' Phone reminders require the Android app.'}</p></div></div>`;}
const metrics=[['steps','Steps','steps',v=>fmt(v)],['sleep','Sleep in this day','hours',v=>fmt(v,1)],['heart','Heart rate · avg','bpm',v=>fmt(v)],['resting','Resting heart · avg','bpm',v=>fmt(v)],['weight','Weight · day avg','lb',v=>fmt(v/453.59237,1)],['active','Active energy','kcal',v=>fmt(v/1000)],['burned','Total energy burned','kcal',v=>fmt(v/1000)],['distance','Distance','miles',v=>fmt(v/1609.344,2)],['water','Water · imported','fl oz',v=>fmt(v*33.814,1)],['nutrition','Food · imported','kcal',v=>fmt(v/1000)]];
function paintHealth(){if(!$('#health-grid'))return;const values=health[day]||{};$('#health-grid').innerHTML=metrics.map(([key,label,unit,convert])=>{const v=values[key],status=v?.status;const detail=!A?'Android app required':status==='ok'?unit:status==='permission'?'Permission needed':status==='empty'?'No shared data':status==='loading'?'Reading…':status==='error'?'Could not read · retry':status==='unavailable'?'Unavailable':'Not connected';return `<div class="metric"><div class="label">${label}</div><strong>${status==='ok'?convert(v.value):'—'}</strong><small>${detail}</small>${v?.sources?.length?`<small>${v.sources.map(s=>esc(s==='com.garmin.android.apps.connectmobile'?'Garmin Connect':s==='com.google.android.apps.fitness'?'Google Fit':s==='com.fitbit.FitbitMobile'?'Fitbit / Google':s)).join(', ')}</small>`:''}</div>`;}).join('');const times=Object.values(values).map(v=>v.at).filter(Boolean).sort();$('#health-note').textContent=`${A?'Health Connect · Read only.':'Connect Garmin / Google through Health Connect in the Android app.'} Imported food calories are shown separately and are not added to your meal log. Sleep covers midnight to midnight in your phone’s current timezone. Total energy already includes active energy.${times.length?' Last read: '+time(times.at(-1))+'.':''}`;}
function sync(){if($('#garmin-fit')&&window.RhythmGarmin)$('#garmin-fit').outerHTML=window.RhythmGarmin.card(day);if(!A){toast('Health Connect is available in the Android app after installation.');return;}health[day]=Object.fromEntries(metrics.map(([k])=>[k,{status:'loading'}]));paintHealth();A.sync(day);const requested=day;setTimeout(()=>{if(health[requested])for(const [k,v] of Object.entries(health[requested]))if(v.status==='loading')health[requested][k]={status:'error'};paintHealth();},20000);}
function entries(date){const all=[...state.meals.filter(x=>x.day===date).map(x=>({...x,kind:'meals'})),...state.stools.filter(x=>x.day===date).map(x=>({...x,kind:'stools'}))].sort((a,b)=>a.at.localeCompare(b.at));if(!all.length)return `<div class="empty">${state.noBowel.includes(date)?'No bowel movement reported.':'Nothing logged for this day yet.'}<br>Use the buttons above to add your first entry.</div>`;return all.map(e=>`<article class="entry"><span class="entry-time">${time(e.at)}</span><span class="entry-icon ${e.kind==='stools'?'bowel':''}" aria-hidden="true">${e.kind==='meals'?'◒':'∿'}</span><div class="entry-main"><strong>${e.kind==='meals'?esc(e.name):'Bristol type '+e.type}</strong><p>${e.kind==='meals'?`${e.category} · ${fmt(e.calories*e.servings)} kcal · ${fmt(e.servings,2)} × ${esc(e.portion||'serving')}`:esc(C.bristol[e.type-1])}</p>${e.kind==='stools'?`<span class="tag">${esc(e.ease)}</span><span class="tag">${esc(e.urgency)} urgency</span><span class="tag">${esc(e.color)}</span><span class="tag">Discomfort ${e.pain}/10</span>`:''}${e.estimate?'<span class="tag">AI-estimated nutrition · review portion sizes</span>':''}${e.notes?`<p>${esc(e.notes)}</p>`:''}<div class="entry-controls"><button data-action="edit" data-kind="${e.kind}" data-id="${e.id}">Edit</button>${e.kind==='meals'?`<button data-action="repeat" data-id="${e.id}">Log again</button>`:''}<button class="delete" data-action="delete" data-kind="${e.kind}" data-id="${e.id}">Delete</button></div></div></article>`).join('');}
function journal(){return heading('The body count.','Meals, movements and the rest of the plot.')+dateBar()+`<div class="two-actions"><button data-action="meal">Log a meal <span>+</span></button><button data-action="stool">Log a bowel movement <span>+</span></button></div>${window.RhythmBodyUI?.actions()||''}<section class="card"><h2>${esc(pretty(day))}</h2>${entries(day)}${!state.stools.some(s=>s.day===day)?`<button class="ghost small" data-action="no-bowel">${state.noBowel.includes(day)?'Undo “no bowel movement”':'Report no bowel movement'}</button>`:''}</section>${window.RhythmBodyUI?.entries(day)||''}<div class="section-head"><h2>Recorded days</h2></div><section class="card"><div class="settings-buttons">${[...new Set([...state.meals,...state.stools,...state.body.vapes,...state.body.orgasms,...state.body.moods,...state.body.caffeine].map(x=>x.day).concat(state.noBowel))].sort().reverse().map(d=>`<button class="secondary small" data-action="open-day" data-day="${d}">${esc(new Date(d+'T12:00:00').toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'}))}</button>`).join('')||'<p class="muted small">Your logged days will appear here.</p>'}</div></section>`;}
function trends(){const days=Array.from({length:7},(_,i)=>C.offsetDay(day,i-6)),rows=days.map(d=>({day:d,t:C.totals(state,d),s:state.stools.filter(s=>s.day===d)})),max=Math.max(1,...rows.map(r=>r.t.calories)),stools=state.stools.filter(s=>days.includes(s.day));return heading('Notice your patterns.','Seven days of your own observations. No scores, no judgment.')+dateBar()+`<section class="card"><h2>A wider view</h2><p class="setting-copy">Prepare 14 or 28 days of food, digestion and automatically read Garmin / Health Connect data for a ChatGPT review.</p><button data-action="ai-review">Review with ChatGPT</button><button class="ghost" data-action="daily-context">Daily check-in</button></section><section class="card"><div class="eyebrow">MEALS YOU LOGGED</div><h2>Calories through the week</h2><div class="bar-chart" role="img" aria-label="Daily logged calories. Exact values are in the table below.">${rows.map(r=>`<div class="bar-col"><small>${r.t.count?fmt(r.t.calories):'—'}</small><div class="bar" style="height:${r.t.count?Math.max(2,r.t.calories/max*120):2}px;${!r.t.count?'background:var(--line)':''}"></div></div>`).join('')}</div><div class="day-labels">${days.map(d=>`<span>${new Date(d+'T12:00:00').toLocaleDateString([],{weekday:'short'})}</span>`).join('')}</div><p class="health-note">These are recorded calories, not an estimate of everything you ate. A dash means no meals logged.</p></section><section class="card"><div class="eyebrow">BOWEL CONSISTENCY</div><h2>Your Bristol types</h2><div class="distribution">${C.bristol.map((s,i)=>`<div title="${esc(s)}"><small>Type ${i+1}</small><strong>${stools.filter(s=>s.type===i+1).length}</strong><small>logs</small></div>`).join('')}</div><p class="health-note">${stools.length} bowel movements recorded in these seven days. Types describe consistency; they do not diagnose a condition.</p></section><section class="card"><h2>Food & digestion together</h2><div class="table-wrap"><table><thead><tr><th>Date</th><th>kcal logged</th><th>Fiber (g)</th><th>Bowel logs</th><th>Bristol</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.day.slice(5)}</td><td>${r.t.count?fmt(r.t.calories):'—'}</td><td>${r.t.count?fmt(r.t.fiber,1)+(r.t.missing.fiber?'*':''):'—'}</td><td>${r.s.length|| (state.noBowel.includes(r.day)?'0 reported':'—')}</td><td>${r.s.map(s=>s.type).join(', ')||'—'}</td></tr>`).join('')}</tbody></table></div><p class="health-note">*Fiber values are incomplete. A dash under bowel logs means no report, not zero movements. Patterns can suggest questions to explore; they do not establish cause.</p></section>`;}
function settings(){return heading('Make it yours.','Your journal, your permissions, your pace.')+`<section class="card"><h2>Garmin + Google health</h2><p class="setting-copy">Daily Rhythm reads shared health data through Health Connect on Android 14 or later. It brings available activity, sleep, heart rate, weight, water and calorie readings alongside your journal.</p><ol class="setting-copy"><li>In Garmin Connect, look for Health Connect under connected app settings and enable the data you want to share, if available in your version.</li><li>Enable Health Connect sharing in your Google health / Fitbit or Google Fit app.</li><li>Tap Connect below and choose which categories Daily Rhythm can read.</li></ol><div class="settings-buttons"><button data-action="connect">Connect Health Connect</button><button class="secondary" data-action="health-settings">Manage access</button></div><p class="health-note">Only data actually shared by those apps can appear. Garmin-only metrics such as Body Battery and training readiness may remain in Garmin. This version reads health data while open; it does not write meals or bowel logs back. Older health history may be restricted by Android’s default read window.</p></section>
<section class="card"><h2>Garmin direct access</h2><p class="setting-copy">Fenix 8 Pro · Health Connect reads are active when permitted. Available stress and other watch readings are imported by the desktop USB helper using Garmin’s official FIT SDK. Cloud history and Body Battery remain unavailable; direct Garmin Health API access still requires approval. Nothing needs to be entered manually.</p></section><section class="card"><h2>Your evening reminder</h2><div class="setting-row"><div><strong>8:00 p.m. every day</strong><p>${A?'Uses your phone’s local timezone.':'Phone reminders require the Android app.'}</p></div><input type="checkbox" id="reminder-toggle" aria-label="Enable daily 8 p.m. phone reminder" ${nativeStatus.reminder?'checked':''} ${!A?'disabled':''}></div>${A?`<p class="note-row">${nativeStatus.reminder?nativeStatus.notifications?'Notification permission is enabled.':'Notifications are blocked in Android settings.':'Phone reminder is off.'} ${nativeStatus.exact?'Exact alarm access is enabled.':'Without exact alarm access, Android can delay the reminder.'}</p><div class="settings-buttons"><button class="secondary small" data-action="exact">Allow exact timing</button><button class="ghost small" data-action="notifications">Notification settings</button></div>`:''}<p class="health-note">The reminder includes a pattern-review nudge when due. Android may stop reminders if you force-stop the app; reopen it to resume.</p></section>
<section class="card"><h2>Optional daily goals</h2><p class="setting-copy">Set your own targets, or leave them blank. These are personal reference points.</p><form id="goals-form"><div class="form-grid three">${[['calories','Calories (kcal)'],['protein','Protein (g)'],['fiber','Fiber (g)']].map(([key,label])=>`<label>${label}<input name="${key}" aria-label="${label} goal" type="number" min="1" max="30000" step="any" inputmode="decimal" value="${state.goals[key]??''}" placeholder="Optional"></label>`).join('')}</div><button type="submit">Save goals</button></form></section>
<section class="card"><h2>Keep a copy</h2><p class="setting-copy">Export a JSON backup for restoring your journal, or a CSV to review in a spreadsheet. Exports contain your personal health entries. JSON includes saved recipes, caffeine/vape/orgasm/mood events, daily check-ins and saved AI reviews. CSV includes logged events and check-ins. Raw Health Connect readings are not included.</p><div class="settings-buttons"><button class="secondary" data-action="export-json">JSON backup</button><button class="secondary" data-action="export-csv">Export CSV</button><button class="ghost" data-action="import">Restore backup</button></div></section>
<section class="card"><h2>Private by design</h2><p class="setting-copy">${A?'No account, ads, analytics or network permission. Your journal is stored in this app’s private phone storage, with Android cloud backup disabled.':'This preview stores your journal in this browser’s local storage. Clearing browser data removes it. Use JSON export to keep a backup.'} Uninstalling the Android app removes its journal. Health Connect access is read-only. AI prompts leave the app only when you copy or share them; ChatGPT receives what you submit there.</p><div class="settings-buttons"><button class="ghost" data-action="privacy">Privacy details</button><button class="danger" data-action="clear">Delete local journal</button></div><p class="health-note">Daily Rhythm 0.4 · Personal tracker · AI estimates are approximate.</p></section>`;}
function select(name,label,choices,value){return `<label>${label}<select name="${name}">${choices.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`;}
function openEditor(kind,id,repeat=false,prefill=null){const old=id?state[kind].find(x=>x.id===id):null;if(id&&!old)return;const now=localTime(new Date().toISOString()),at=old&&!repeat?localTime(old.at):day+'T'+now.slice(11);const x=prefill||old||{};$('#editor-title').textContent=repeat?'Log this meal again':old?'Edit your entry':kind==='meals'?'What did you eat?':'Your bowel check-in';

if(kind==='meals'&&x.estimate)fields+=`<p class="preview">AI estimate · ${esc(x.estimate.confidence)} confidence. Check ingredients, assumptions and amounts; all values below are per serving.</p><details><summary>Estimate assumptions</summary><p class="setting-copy">${x.estimate.assumptions.map(esc).join('<br>')}</p></details>`;
if(kind==='meals')fields+=`<label>Meal or food<input name="name" required maxlength="180" placeholder="e.g. Chicken, rice & vegetables" value="${esc(x.name||'')}"></label><div class="form-grid">${select('category','Meal',['Breakfast','Lunch','Dinner','Snack'],x.category||'Dinner')}<label>Servings<input name="servings" type="number" required min="0.01" max="100" step="any" inputmode="decimal" value="${x.servings||1}"></label></div><label>One serving is…<input name="portion" maxlength="150" placeholder="e.g. 1 bowl, 100 g, 1 package" value="${esc(x.portion||'')}"></label><p class="form-note">Enter nutrition <b>per serving</b> from the label or your estimate. Values are multiplied by servings. Leave unknown nutrients blank.</p><div class="form-grid">${[['calories','Calories (kcal)'],['protein','Protein (g)'],['carbs','Carbs (g)'],['fat','Fat (g)'],['fiber','Fiber (g)'],['sugar','Sugar (g)'],['sodium','Sodium (mg)']].map(([k,label])=>`<label>${label}<input name="${k}" type="number" min="0" max="${k==='sodium'?100000:30000}" step="any" inputmode="decimal" ${k==='calories'?'required':''} value="${x[k]??''}" placeholder="${k==='calories'?'Required':'Unknown'}"></label>`).join('')}</div>`;
else fields+=`<p class="form-note">Choose the closest consistency using the Bristol stool scale.</p><fieldset style="border:0;padding:0;margin:0"><legend class="eyebrow">CONSISTENCY</legend><div class="bristol-list">${C.bristol.map((s,i)=>`<label class="bristol-option"><input type="radio" name="type" value="${i+1}" required ${x.type===i+1?'checked':''}><b>${i+1}</b><span>${esc(s)}</span></label>`).join('')}</div></fieldset><div class="form-grid">${select('ease','Ease',['Easy','Some straining','Difficult'],x.ease||'Easy')}${select('urgency','Urgency',['None','Mild','Strong'],x.urgency||'None')}${select('color','Color',['Brown','Light brown','Yellow','Green','Very dark / black','Red','Pale / clay','Other'],x.color||'Brown')}<label>Discomfort (0–10)<input type="number" name="pain" min="0" max="10" step="1" inputmode="numeric" required value="${x.pain??0}"></label></div>`;
if(kind==='stools'){const z=x.details||{};fields+=`<details class="bowel-details"><summary>More bowel detail (optional)</summary><div class="form-grid"><label>Minutes on toilet<input name="minutes" type="number" min="0" max="240" step="any" value="${z.minutes??''}"></label><label>Bloating (0–10)<input name="bloating" type="number" min="0" max="10" step="any" value="${z.bloating??''}"></label>${select('size','Amount',['Unspecified','Small','Medium','Large'],z.size)}${select('evacuation','Evacuation',['Unspecified','Complete','Incomplete'],z.evacuation)}${select('blood','Visible blood',['Unspecified','No','Yes'],z.blood)}${select('mucus','Visible mucus',['Unspecified','No','Yes'],z.mucus)}</div></details>`;}

$('#editor-body').innerHTML=`<form id="entry-form">${fields}</form>`;$('#entry-form').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);try{const date=new Date(d.get('at'));if(!Number.isFinite(date.getTime())||date.getTime()>Date.now()+60000)throw Error('Choose a valid time that is not in the future.');let item={id:old&&!repeat?old.id:C.id(),at:date.toISOString(),day:old&&!repeat&&String(d.get('at'))===localTime(old.at)?old.day:String(d.get('at')).slice(0,10),notes:String(d.get('notes')),offsetMinutes:old&&!repeat&&String(d.get('at'))===localTime(old.at)?old.offsetMinutes:date.getTimezoneOffset()};if(kind==='meals'){for(const key of ['name','category','portion'])item[key]=String(d.get(key));item.servings=Number(d.get('servings'));if(x.estimate)item.estimate=x.estimate;for(const n of C.nutrients)item[n]=d.get(n)===''?null:Number(d.get(n));}else{item.type=Number(d.get('type'));item.pain=Number(d.get('pain'));item.details={};for(const k of ['minutes','bloating'])item.details[k]=d.get(k)===''||d.get(k)===null?null:Number(d.get(k));for(const k of ['size','evacuation','blood','mucus'])item.details[k]=String(d.get(k)||'Unspecified');for(const key of ['ease','urgency','color'])item[key]=String(d.get(key));}const next=C.upsert(state,kind,item);if(save(next)){$('#editor').close();day=item.day;view();toast('Entry saved on this device.');}}catch(e){$('#form-error').textContent=e.message;}};

function stamp(iso){const d=new Date(iso);return C.dayOf(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function form(kind,id){
 const old=id?P.getState().body[kind].find(x=>x.id===id):null,x=old||{},now=stamp(new Date().toISOString()),at=old?stamp(old.at):P.day()+'T'+now.slice(11);
 $('#editor-title').textContent=titles[kind];let fields=`<label>When<input type="datetime-local" name="at" value="${at}" max="${now}" required></label>`;
 if(kind==='vapes')fields+=`<p class="form-note">Count what happened. Hits are not a measured THC dose.</p><div class="form-grid">${num('hits','Number of hits',x.hits??1,1,500,'required')}${num('puffSeconds','Average seconds per hit',x.puffSeconds,0,60)}${num('sessionMinutes','Session duration (minutes)',x.sessionMinutes,0,1440)}${num('effect','Felt effect (0–10)',x.effect,0,10)}</div><label>Product / cartridge<input name="product" maxlength="150" value="${e(x.product||'')}" placeholder="Optional name from the label"></label><div class="form-grid">${num('thcPercent','Label THC (%)',x.thcPercent,0,100)}${num('cbdPercent','Label CBD (%)',x.cbdPercent,0,100)}</div>${choose('purpose','Reason (optional)',['Unspecified','Recreation','Sleep','Symptom relief','Other'],x.purpose)}<p class="form-note">Leave unknowns blank. Cartridge potency does not tell us the amount absorbed per puff.</p>`;
 if(kind==='caffeine')fields+=`<p class="form-note">Fuel for the brain worm. Record when and how much; leave unknown caffeine blank.</p><label>Drink / product<input name="source" maxlength="150" value="${e(x.source||'')}" placeholder="Coffee, tea, energy drink, tablet…"></label><label>Amount consumed<input name="amount" maxlength="100" value="${e(x.amount||'')}" placeholder="e.g. 12 fl oz / 355 ml, 1 tablet"></label>${num('mg','Total caffeine consumed (mg)',x.mg,0,3000)}${choose('basis','Amount based on',['Unknown','Label','Estimate'],x.basis)}<p class="form-note">Use the label when available. Brewed coffee varies; a volume alone cannot determine caffeine. This is the total consumed, not mg per serving.</p>`;
 if(kind==='orgasms')fields+=`<p class="form-note">A timestamp for the nervous system’s little fireworks department. No partner identities needed.</p><div class="form-grid">${num('count','Number of orgasms',x.count??1,1,100,'required')}${num('durationMinutes','Activity duration (minutes)',x.durationMinutes,0,1440)}${num('pleasure','Pleasure (0–10)',x.pleasure,0,10)}${num('pain','Discomfort (0–10)',x.pain,0,10)}</div>${choose('context','Context (optional)',['Unspecified','Solo','Partnered'],x.context)}`;
 if(kind==='moods')fields+=`<p class="form-note">A brain weather report. Log before and after an event if you want to compare how you felt.</p><div class="form-grid">${[['mood','Mood (0 low, 10 high)'],['energy','Energy (0 low, 10 high)'],['anxiety','Anxiety (0 none, 10 high)'],['focus','Focus (0 low, 10 high)'],['stress','Felt stress (0 none, 10 high)']].map(([k,label])=>num(k,label,x[k],0,10)).join('')}</div>${choose('context','Moment',['Unspecified','Waking','Before meal','After meal','Before vape','After vape','Before orgasm','After orgasm','Bedtime','Other'],x.context)}`;
 fields+=`<label>Private notes<textarea name="notes" maxlength="2000">${e(x.notes||'')}</textarea></label><p class="form-note">Notes stay out of AI review prompts. Event details are included only when you choose that review option.</p><p id="body-error" class="form-error" role="alert"></p><button class="full">${old?'Save changes':'Save event'}</button>`;
 $('#editor-body').innerHTML=`<form id="body-form">${fields}</form>`;
 $('#body-form').onsubmit=ev=>{ev.preventDefault();try{const f=new FormData(ev.target),d=new Date(f.get('at'));if(!Number.isFinite(d.getTime())||d.getTime()>Date.now()+60000)throw Error('Choose a valid time that is not in the future.');const value={id:old?.id||C.id(),at:d.toISOString(),day:old&&String(f.get('at'))===stamp(old.at)?old.day:String(f.get('at')).slice(0,10),offsetMinutes:old&&String(f.get('at'))===stamp(old.at)?old.offsetMinutes:d.getTimezoneOffset(),notes:String(f.get('notes'))};
 const keys=kind==='caffeine'?['mg']:kind==='vapes'?['hits','puffSeconds','sessionMinutes','thcPercent','cbdPercent','effect']:kind==='orgasms'?['count','durationMinutes','pleasure','pain']:['mood','energy','anxiety','focus','stress'];for(const k of keys)value[k]=f.get(k)===''?null:Number(f.get(k));for(const k of kind==='caffeine'?['source','amount','basis']:kind==='vapes'?['product','purpose']:['context'])value[k]=String(f.get(k));const entry=B.event(kind,value),next=JSON.parse(JSON.stringify(P.getState()));next.body[kind]=next.body[kind].filter(x=>x.id!==entry.id);next.body[kind].push(entry);if(P.save(next)){$('#editor').close();P.view();P.toast('Event saved on this device.');}}catch(err){$('#body-error').textContent=err.message;}};
 $('#editor').showModal();
}
function summary(kind,x){if(kind==='caffeine')return `${x.mg===null?'Caffeine amount unknown':x.mg+' mg caffeine'}${x.source?' · '+x.source:''}${x.amount?' · '+x.amount:''} · ${x.basis.toLowerCase()}`;if(kind==='vapes')return `${x.hits} vape ${x.hits===1?'hit':'hits'}${x.product?' · '+x.product:''}${x.puffSeconds!==null?' · '+x.puffSeconds+' s/hit':''}`;if(kind==='orgasms')return `${x.count} ${x.count===1?'orgasm':'orgasms'}${x.context==='Unspecified'?'':' · '+x.context}`;return ['mood','energy','anxiety','focus','stress'].filter(k=>x[k]!==null).map(k=>k+' '+x[k]+'/10').join(' · ');}
function entries(day){const body=P.getState().body,items=Object.keys(body).flatMap(k=>body[k].filter(x=>x.day===day).map(x=>({...x,kind:k}))).sort((a,b)=>a.at.localeCompare(b.at));return `<section class="card body-events"><h2>The other bodily business</h2>${items.length?items.map(x=>`<article class="entry"><span class="entry-time">${new Date(x.at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</span><span class="entry-icon" aria-hidden="true">${x.kind==='caffeine'?'☕':x.kind==='vapes'?'≈':x.kind==='orgasms'?'✦':'☁'}</span><div class="entry-main"><strong>${e(summary(x.kind,x))}</strong>${x.notes?`<p>${e(x.notes)}</p>`:''}<div class="entry-controls"><button data-body="edit" data-kind="${x.kind}" data-id="${e(x.id)}">Edit</button><button data-body="delete" data-kind="${x.kind}" data-id="${e(x.id)}">Delete</button></div></div></article>`).join(''):'<p class="setting-copy">No caffeine, vape, orgasm or mood events logged for this day. That means unknown, not zero.</p>'}<button class="ghost" data-action="daily-context">Confirm the day’s logs</button></section>`;}
function actions(){return `<div class="body-actions"><button data-body="new" data-kind="caffeine"><span aria-hidden="true">☕</span> Caffeine</button><button data-body="new" data-kind="vapes"><span aria-hidden="true">≈</span> Vape</button><button data-body="new" data-kind="orgasms"><span aria-hidden="true">✦</span> Orgasm</button><button data-body="new" data-kind="moods"><span aria-hidden="true">☁</span> Mood</button></div>`;}
$('#main').addEventListener('click',ev=>{const b=ev.target.closest('[data-body]');if(!b)return;const k=b.dataset.kind;if(!['vapes','orgasms','moods','caffeine'].includes(k))return;if(b.dataset.body==='new')form(k);else if(b.dataset.body==='edit')form(k,b.dataset.id);else if(b.dataset.body==='delete')P.confirmBox('Delete this body event?',()=>{const n=JSON.parse(JSON.stringify(P.getState()));n.body[k]=n.body[k].filter(x=>x.id!==b.dataset.id);if(P.save(n))P.view();},'Delete event');});
window.RhythmBodyUI={actions,entries};P.view();
})();
</script><script>(function(){
'use strict';
const P=window.RhythmApp,C=window.RhythmCore,R=window.RhythmAI,e=P.esc,A=P.native;
function read(){try{const x=JSON.parse(A?.loadGarmin?.()||'null');return x?.schema==='daily-rhythm.garmin-fit.v1'&&Array.isArray(x.samples)?x:null;}catch(_){return null;}}
function day(at){return C.dayOf(new Date(at));}
function summarize(samples){const out={};for(const x of samples){if(!Number.isFinite(x.value))continue;const a=out[x.kind]??={count:0,sum:0,min:x.value,max:x.value};a.count++;a.sum+=x.value;a.min=Math.min(a.min,x.value);a.max=Math.max(a.max,x.value);}for(const a of Object.values(out)){a.mean=Math.round(a.sum/a.count*100)/100;delete a.sum;}return out;}
function review(end,days){const x=read();if(!x)return {status:'not_imported',daily:[]};const from=R.offset(end,1-days),samples=x.samples.filter(s=>day(s.at)>=from&&day(s.at)<=end);const groups={};for(const s of samples){const d=day(s.at);(groups[d]??=[]).push(s);}const daily=Object.entries(groups).sort().map(([date,items])=>({date,metrics:summarize(items),firstSample:items[0].at,lastSample:items.at(-1).at}));const hourly={};for(const s of samples){const h=s.at.slice(0,13)+':00:00Z';(hourly[h]??=[]).push(s);}return {status:samples.length?'ok':'no_samples_in_window',importedAt:x.importedAt,coverageStart:x.coverageStart,coverageEnd:x.coverageEnd,units:x.units,limitations:x.limitations,issues:x.issues,unknownMessageTypes:x.unknownMessageTypes,daily,hourly:Object.entries(hourly).sort().map(([hourUtc,items])=>({hourUtc,metrics:summarize(items)})),activities:(x.activities||[]).filter(a=>day(a.endUtc)>=from&&day(a.endUtc)<=end),activityUnits:{total_timer_time:'seconds',total_elapsed_time:'seconds',total_distance:'meters',total_calories:'kcal',avg_heart_rate:'bpm',max_heart_rate:'bpm',total_ascent:'meters',total_descent:'meters'}};}
function card(date){const x=read();return `<section class="card" id="garmin-fit"><h2>Garmin · USB receipts</h2>${x?`<p class="health-note">Imported ${e(new Date(x.importedAt).toLocaleString())}. ${x.filesRead} files decoded. Refresh after the desktop helper syncs.</p><div class="health-grid">${Object.entries(summarize(x.samples.filter(s=>day(s.at)===date))).map(([k,v])=>`<div class="metric"><div class="label">${e({stress:'Garmin stress',respiration:'Respiration',spo2:'Oxygen',heart:'Heart rate',restingHeart:'Resting heart',hrv:'HRV',hrvNight:'Night HRV'}[k]||k)}</div><strong>${P.fmt(v.mean,1)}</strong><small>${e(x.units[k])} · ${v.count} samples</small><small>Range ${v.min}–${v.max}</small></div>`).join('')||'<p class="setting-copy">No imported samples for this day.</p>'}</div><p class="health-note">Observed sample averages, not a complete daily Garmin score. Latest sample: ${x.coverageEnd?e(new Date(x.coverageEnd).toLocaleString()):'none'}. ${x.issues?.length?'Some files could not be decoded; available readings are partial.':''}</p>`:'<p class="setting-copy">The desktop helper reads available files when your watch and phone are connected by USB. Garmin values never need to be typed in.</p>'}<p class="health-note">USB snapshots are separate from Health Connect. Only available watch files can be read. Body Battery and undocumented fields are not inferred. The computer must be running the sync helper; this is not wireless Garmin cloud access.</p></section>`;}
window.RhythmGarmin={read,review,card};P.view();
})();
</script>
